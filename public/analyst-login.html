<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Portal Login - Bank of Maharashtra FINSPARK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f8f9ff; font-family: 'IBM Plex Sans', sans-serif;">

  <!-- Navigation Bar -->
  <nav class="navbar" style="background-color: #005994; border-bottom: 1px solid #00497b; padding: 0.85rem 2rem;">
    <a href="index.html" class="brand" style="color: #ffffff; display: flex; align-items: center; gap: 0.65rem;">
      <span class="brand-icon" style="color: #9ccaff; font-size: 1.3rem;">⚡</span>
      <span style="font-weight: 700; letter-spacing: 0.02em;">FINSPARK</span>
      <span style="font-size: 0.72rem; background: rgba(255,255,255,0.15); color: #d0e4ff; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 600; text-transform: uppercase;">
        Bank of Maharashtra
      </span>
    </a>
    <div class="nav-links">
      <a href="login.html" class="btn btn-outline" style="color: #ffffff; border-color: rgba(255,255,255,0.4); background: transparent;">User Banking</a>
    </div>
  </nav>

  <main class="container" style="max-width: 440px; margin-top: 3.5rem;">
    <div class="card" style="padding: 2rem; background: #ffffff; border: 1px solid #c0c7d2; border-radius: 8px; border-top: 4px solid #005994; box-shadow: 0 4px 16px rgba(11, 28, 48, 0.06);">
      <h2 style="font-size: 1.5rem; color: #0b1c30; margin-bottom: 0.25rem; text-align: center; font-weight: 700;">Analyst Portal Login</h2>
      <p style="color: #404751; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">Sign in to access Bank of Maharashtra fraud investigation controls</p>

      <div id="analyst-alert" class="alert" style="display:none;"></div>

      <form id="analyst-login-form">
        <div class="form-group">
          <label class="form-label" for="analyst-email" style="font-weight: 600; color: #0b1c30;">Analyst Email</label>
          <input type="email" id="analyst-email" class="form-input" placeholder="analyzer3@gmail.com" required value="analyzer3@gmail.com" style="padding: 0.7rem;">
        </div>

        <div class="form-group">
          <label class="form-label" for="analyst-password" style="font-weight: 600; color: #0b1c30;">Password</label>
          <input type="password" id="analyst-password" class="form-input" placeholder="Enter password" required value="analyzer123" style="padding: 0.7rem;">
        </div>

        <button type="submit" id="analyst-submit-btn" class="btn btn-primary btn-full" style="padding: 0.75rem; margin-top: 0.5rem; font-weight: 700; background: #0072bb; border-color: #0072bb; box-shadow: 0 2px 8px rgba(0, 114, 187, 0.25);">
          Sign In to Analyst Portal
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #404751; background: #eff4ff; padding: 0.65rem; border-radius: 4px; border: 1px solid #d3e4fe;">
        Common Analyst Credentials: <code>analyzer3@gmail.com</code> / <code>analyzer123</code>
      </div>
    </div>
  </main>

  <footer class="footer" style="background: #ffffff; border-top: 1px solid #c0c7d2; margin-top: 4rem;">
    FINSPARK — Bank of Maharashtra Fraud Investigation Platform
  </footer>

  <script src="js/analyst-login-ui.js"></script>
</body>
</html>
